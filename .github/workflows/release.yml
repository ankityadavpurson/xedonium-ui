name: Release

# One run per push to main. `changes` looks at which files the push touched:
#   lib  (src/, package.json, yarn.lock, tailwind-preset.js, build config/scripts) -> npm publish
#   docs (docs/, src/, scripts/, package.json, yarn.lock)                  -> GitHub Pages deploy
# (the docs render the library straight from src/, so a lib change redeploys the docs too).
# verify (lint, types, tests with 90% coverage, build) runs first when either changed,
# then docs deploy and npm publish run in parallel. Manual runs do everything.
#
# npm version is bumped automatically from conventional-commit prefixes since
# the last v* tag:
#   major: "type!:" or "BREAKING CHANGE" in the commit
#   minor: feat:
#   patch: fix: bug: ui: style: perf: refactor:
#   none:  docs: chore: ci: test: build: (no release is made)
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  changes:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      lib: ${{ steps.filter.outputs.lib }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: filter
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          LIB='^(src/|package\.json$|yarn\.lock$|tailwind-preset\.js$|tsconfig\.build\.json$|tsconfig\.json$|vite\.config\.js$|scripts/(copy-css|check-exports))'
          DOCS='^(docs/|src/|package\.json$|yarn\.lock$|scripts/(check-docs|spa-fallback))'

          # Manual run, first push, or a force-push whose old commit is gone: assume everything changed
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] \
            || [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
            || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "lib=true" >> "$GITHUB_OUTPUT"
            echo "docs=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          FILES=$(git diff --name-only "$BEFORE" "$AFTER")
          echo "Changed files:"; echo "$FILES"
          echo "lib=$(echo "$FILES" | grep -qE "$LIB" && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "docs=$(echo "$FILES" | grep -qE "$DOCS" && echo true || echo false)" >> "$GITHUB_OUTPUT"

  verify:
    needs: changes
    if: needs.changes.outputs.lib == 'true' || needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn lint
      - run: yarn typecheck
      - run: yarn test:coverage # fails below 90% coverage (thresholds in vitest.config.js)
      - run: yarn build
      - run: yarn check:exports # every exports target exists and xedonium/Button etc. resolve (ESM + CJS)
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          if-no-files-found: error

  docs-build:
    needs: [changes, verify]
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn docs:check
      - run: yarn docs:build # also writes dist/404.html so deep links work on Pages
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/dist

  docs-deploy:
    needs: docs-build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  publish:
    needs: [changes, verify]
    if: needs.changes.outputs.lib == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write # push version commit + tag
      id-token: write # npm provenance
    concurrency:
      group: publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn
          registry-url: https://registry.npmjs.org
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }} # .npmrc references it; yarn cache lookup fails if unset

      - name: Work out version bump
        id: bump
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          if [ -n "$LAST_TAG" ]; then RANGE="$LAST_TAG..HEAD"; else RANGE="HEAD"; fi
          echo "Last tag: ${LAST_TAG:-none}"

          LEVEL=none
          rank() { case "$1" in major) echo 3;; minor) echo 2;; patch) echo 1;; *) echo 0;; esac; }
          raise() { [ "$(rank "$1")" -gt "$(rank "$LEVEL")" ] && LEVEL=$1 || true; }

          while IFS= read -r -d $'\x1e' COMMIT; do
            COMMIT=$(printf '%s' "$COMMIT" | sed '/[^[:space:]]/,$!d') # drop leading blank lines
            SUBJECT=$(printf '%s' "$COMMIT" | head -n1)
            case "$SUBJECT" in "chore(release):"*) continue;; esac
            if printf '%s' "$COMMIT" | grep -q 'BREAKING CHANGE' \
              || printf '%s' "$SUBJECT" | grep -qiE '^[a-z]+(\([^)]*\))?!:'; then
              raise major
            elif printf '%s' "$SUBJECT" | grep -qiE '^feat(\([^)]*\))?:'; then
              raise minor
            elif printf '%s' "$SUBJECT" | grep -qiE '^(fix|bug|ui|style|perf|refactor)(\([^)]*\))?:'; then
              raise patch
            fi
          done < <(git log "$RANGE" --format='%B%x1e')

          echo "Bump level: $LEVEL"
          echo "level=$LEVEL" >> "$GITHUB_OUTPUT"

      - name: Get built library
        if: steps.bump.outputs.level != 'none'
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Bump version
        if: steps.bump.outputs.level != 'none'
        id: version
        run: |
          git config user.name "Ankit Yadav"
          git config user.email "41839222+ankityadavpurson@users.noreply.github.com"
          npm version "${{ steps.bump.outputs.level }}" --no-git-tag-version
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          git commit -am "chore(release): v$VERSION [skip ci]"
          git tag "v$VERSION"

      - name: Publish
        if: steps.bump.outputs.level != 'none'
        run: npm publish --provenance --access public --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Push version commit and tag
        if: steps.bump.outputs.level != 'none'
        run: git push origin HEAD:main "v${{ steps.version.outputs.version }}" # --follow-tags skips lightweight tags

      - name: Create GitHub release
        if: steps.bump.outputs.level != 'none'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          zip -rq "xedonium-dist-v$VERSION.zip" dist
          npm pack --ignore-scripts
          gh release create "v$VERSION" \
            "xedonium-dist-v$VERSION.zip" "xedonium-$VERSION.tgz" \
            --title "v$VERSION" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
