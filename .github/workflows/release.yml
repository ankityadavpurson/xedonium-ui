name: Release

# One run per push to main. Docs deploy and npm publish run in parallel.
#
# npm version is bumped automatically from conventional-commit prefixes since
# the last v* tag:
#   major: "type!:" or "BREAKING CHANGE" in the commit
#   minor: feat:
#   patch: fix: bug: ui: style: perf: refactor:
#   none:  docs: chore: ci: test: build: (no release is made)
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  docs-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn docs:check
      - run: yarn docs:build # also writes dist/404.html so deep links work on Pages
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/dist

  docs-deploy:
    needs: docs-build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push version commit + tag
      id-token: write # npm provenance
    concurrency:
      group: publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          registry-url: https://registry.npmjs.org

      - name: Work out version bump
        id: bump
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          if [ -n "$LAST_TAG" ]; then RANGE="$LAST_TAG..HEAD"; else RANGE="HEAD"; fi
          echo "Last tag: ${LAST_TAG:-none}"

          LEVEL=none
          rank() { case "$1" in major) echo 3;; minor) echo 2;; patch) echo 1;; *) echo 0;; esac; }
          raise() { [ "$(rank "$1")" -gt "$(rank "$LEVEL")" ] && LEVEL=$1 || true; }

          while IFS= read -r -d $'\x1e' COMMIT; do
            COMMIT=$(printf '%s' "$COMMIT" | sed '/[^[:space:]]/,$!d') # drop leading blank lines
            SUBJECT=$(printf '%s' "$COMMIT" | head -n1)
            case "$SUBJECT" in "chore(release):"*) continue;; esac
            if printf '%s' "$COMMIT" | grep -q 'BREAKING CHANGE' \
              || printf '%s' "$SUBJECT" | grep -qiE '^[a-z]+(\([^)]*\))?!:'; then
              raise major
            elif printf '%s' "$SUBJECT" | grep -qiE '^feat(\([^)]*\))?:'; then
              raise minor
            elif printf '%s' "$SUBJECT" | grep -qiE '^(fix|bug|ui|style|perf|refactor)(\([^)]*\))?:'; then
              raise patch
            fi
          done < <(git log "$RANGE" --format='%B%x1e')

          echo "Bump level: $LEVEL"
          echo "level=$LEVEL" >> "$GITHUB_OUTPUT"

      - name: Install, lint, build
        if: steps.bump.outputs.level != 'none'
        run: |
          yarn install --frozen-lockfile
          yarn lint
          yarn test:coverage # fails below 90% coverage
          yarn build

      - name: Bump version
        if: steps.bump.outputs.level != 'none'
        id: version
        run: |
          git config user.name "Ankit Yadav"
          git config user.email "41839222+ankityadavpurson@users.noreply.github.com"
          npm version "${{ steps.bump.outputs.level }}" --no-git-tag-version
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          git commit -am "chore(release): v$VERSION [skip ci]"
          git tag "v$VERSION"

      - name: Publish
        if: steps.bump.outputs.level != 'none'
        run: npm publish --provenance --access public --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Push version commit and tag
        if: steps.bump.outputs.level != 'none'
        run: git push origin HEAD:main --follow-tags
