<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="description" content="Minimal, theme-aware React + Tailwind UI components." />
		<!-- Link previews (Slack, X, LinkedIn, ...). The image URL has to be absolute; swap -dark for the light card if you prefer it. -->
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="Xedonium" />
		<meta property="og:title" content="Xedonium: minimal, theme-aware React UI" />
		<meta
			property="og:description"
			content="Forms, charts, overlays and 160+ icons with light and dark themes, each one a separate module you can import on its own."
		/>
		<meta property="og:url" content="https://ankityadavpurson.github.io/xedonium-ui/" />
		<meta property="og:image" content="https://ankityadavpurson.github.io/xedonium-ui/social-preview-dark.png" />
		<meta property="og:image:type" content="image/png" />
		<meta property="og:image:width" content="1280" />
		<meta property="og:image:height" content="640" />
		<meta property="og:image:alt" content="Xedonium: minimal, theme-aware React UI" />
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="Xedonium: minimal, theme-aware React UI" />
		<meta
			name="twitter:description"
			content="Forms, charts, overlays and 160+ icons with light and dark themes, each one a separate module you can import on its own."
		/>
		<meta name="twitter:image" content="https://ankityadavpurson.github.io/xedonium-ui/social-preview-dark.png" />
		<title>Xedonium</title>
		<!-- Static fan icon for first paint; ThemeProvider swaps in the theme-matched one -->
		<link id="app-favicon" rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.jsx"></script>
	</body>
</html>
